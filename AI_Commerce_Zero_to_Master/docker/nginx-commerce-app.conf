server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://commerce-java:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /java-health {
    proxy_pass http://commerce-java:8080/actuator/health;
  }

  location /python/ {
    rewrite ^/python/(.*)$ /$1 break;
    proxy_pass http://ai-python:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /python;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
