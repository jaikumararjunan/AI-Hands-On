name: ai-commerce-local
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgvector_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:latest
    ports: ["${REDIS_PORT:-6379}:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["${QDRANT_PORT:-6333}:6333", "${QDRANT_GRPC_PORT:-6334}:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  kafka:
    image: apache/kafka:latest
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  ai-python:
    build: { context: ../ai-python }
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      PGVECTOR_DSN: postgresql://commerce:commerce@postgres:5432/commerce
      EMBEDDING_PROVIDER: hash
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["${AI_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 18
  commerce-java:
    build: { context: ../backend-java/commerce-core }
    environment:
      AI_SERVICE_URL: http://ai-python:8000
      SPRING_PROFILES_ACTIVE: ${JAVA_SPRING_PROFILE:-default}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["${JAVA_PORT:-8080}:8080"]
    depends_on:
      ai-python: { condition: service_healthy }
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 35s
      retries: 12
  commerce-app:
    image: nginx:alpine
    volumes:
      - ../commerce-app:/usr/share/nginx/html:ro
      - ../docker/nginx-commerce-app.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${APP_PORT:-9200}:80"]
    depends_on:
      commerce-java: { condition: service_healthy }
      ai-python: { condition: service_healthy }
  learning-site:
    image: nginx:alpine
    volumes:
      - ../learning-site:/usr/share/nginx/html:ro
      - ../docker/nginx-learning.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${LEARNING_PORT:-9100}:80"]
  mlflow:
    profiles: ["full"]
    image: ghcr.io/mlflow/mlflow:latest
    command: ["mlflow","server","--host","0.0.0.0","--port","5000"]
    ports: ["${MLFLOW_PORT:-5000}:5000"]
  otel-collector:
    profiles: ["full"]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["${OTEL_GRPC_PORT:-4317}:4317", "${OTEL_HTTP_PORT:-4318}:4318", "${OTEL_METRICS_PORT:-9464}:9464"]
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:latest
    volumes: ["./prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    profiles: ["full"]
    image: grafana/grafana:latest
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
volumes:
  pgvector_data:
  qdrant_data:
