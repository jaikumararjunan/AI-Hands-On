resources:
  - ../../base
nameSuffix: -preprod
replicas:
  - name: commerce-core
    count: 2
  - name: ai-python
    count: 2
patches:
  - target:
      kind: Deployment
      name: commerce-core
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: deployment.environment.name=preprod,service.version=0.2.0
  - target:
      kind: Deployment
      name: ai-python
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: deployment.environment.name=preprod,service.version=0.2.0
