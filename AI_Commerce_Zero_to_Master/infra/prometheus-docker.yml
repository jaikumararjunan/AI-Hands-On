global:
  scrape_interval: 15s
scrape_configs:
  - job_name: commerce-java
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["commerce-java:8080"] }]
  - job_name: ai-python
    metrics_path: /metrics
    static_configs: [{ targets: ["ai-python:8000"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:9464"] }]
